name: Deploy migrations

# Applies supabase/migrations/ to the production project whenever a merge to
# main touches them. Vercel deploys the same commit on its own, so this job is
# what keeps the schema ahead of the code that reads it. The failure it exists
# to prevent is Sentry JAVASCRIPT-NEXTJS-2Q / -2D (2026-08-27): PR #119 went
# live selecting control_checkins.location_failure_reason while its migration
# still sat unpushed, and every admin event page 500'd with 42703 until
# `supabase db push` was run by hand. The same thing happened on 2026-07-03
# when control_checkins itself was created.
#
# Required repository settings (Settings → Secrets and variables → Actions),
# documented in docs/database-setup.md → "Push migrations to remote":
#   secrets.SUPABASE_ACCESS_TOKEN  personal access token (Dashboard → Account → Access Tokens)
#   secrets.SUPABASE_DB_PASSWORD   the project's Postgres password
#   vars.SUPABASE_PROJECT_REF      the project ref (not secret; appears in every dashboard URL)

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Manual re-run: after a failed push, or to apply migrations that merged
  # before the secrets above were configured.
  workflow_dispatch:

# Queue, never cancel. ci.yml uses cancel-in-progress: true, which is fine for
# tests but would abort `db push` partway through a migration set — that is why
# this lives in its own workflow with its own concurrency group.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      # Fail with a pointer to the docs instead of letting the CLI hang on a
      # login prompt or emit an opaque auth error.
      - name: Check required configuration
        run: |
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=(secrets.SUPABASE_ACCESS_TOKEN)
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing+=(secrets.SUPABASE_DB_PASSWORD)
          [ -n "$SUPABASE_PROJECT_REF" ] || missing+=(vars.SUPABASE_PROJECT_REF)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository configuration: ${missing[*]}. See docs/database-setup.md → 'Push migrations to remote'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Match the `supabase` devDependency in package.json, i.e. what
          # `npx supabase db push` runs locally. Deliberately not the 2.105.0
          # pin in ci.yml: that works around a `supabase start` regression,
          # and this job never starts a local stack.
          version: 2.115.0

      # --project-ref makes `supabase link` unnecessary (verified locally with
      # --dry-run). Only migrations absent from the remote history table are
      # applied, so re-running on an already-current database is a no-op.
      - name: Push migrations to production
        run: >-
          supabase db push
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"
          --yes
