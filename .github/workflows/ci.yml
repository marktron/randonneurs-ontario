name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:run

  # Real-browser layout checks for the printed control card. These need a
  # layout engine (jsdom/happy-dom in `verify` has none) but no database: the
  # /control-cards/print route is query-param driven and sits outside the
  # /admin/* proxy matcher. Kept in its own job with its own Playwright config
  # so it doesn't pull in tests/e2e/global-setup.ts and its Supabase client.
  print-layout:
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next dev` boots without a .env.local. Nothing on this
      # route talks to Supabase; these only satisfy client-side construction.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_CURRENT_SEASON: '2026'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e:print-layout

  # Runs the integration-real suite against a real local Postgres. These tests
  # exercise the actual schema (columns, constraints, triggers, RLS) instead of
  # mocked Supabase, so they catch schema/behaviour drift that the mock-based
  # suite in `verify` cannot. See docs/TESTING.md → "CI/CD Integration".
  integration-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`: CLI v2.106.0 (2026-06-11) regressed `supabase
          # start` so the service_role/public-schema bootstrap grants are no
          # longer applied, making every real-DB test fail with `42501
          # permission denied`. v2.105.0 is the last known-good. Re-evaluate
          # `latest` once a fixed release ships.
          version: 2.105.0

      # Boots the local stack (Docker) and applies migrations + seed.sql, which
      # the integration-real tests depend on (chapters, awards, routes, etc.).
      - name: Start Supabase
        run: supabase start

      # Map the local stack's generated keys to the env var names the tests
      # read (see tests/integration-real/helpers/supabase.ts).
      - name: Export Supabase env
        run: |
          supabase status -o env > supabase.env
          # shellcheck disable=SC1091
          source supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_CURRENT_SEASON=2026"
          } >> "$GITHUB_ENV"
          rm -f supabase.env

      - run: npm run test:integration-real

      # The affected production path is Safari/WebKit on an older iPhone.
      # Keep this focused on the digital card: the dependency project runs
      # read-only WebKit smoke tests first, then this project performs a real
      # GPS check-in, server sync, and reload on a separate registration.
      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit

      - name: Test digital card on iPhone WebKit
        run: >-
          npx playwright test tests/e2e/brevet-card.spec.ts
          --project=webkit-card-mutation

      - name: Stop Supabase
        if: always()
        run: supabase stop
